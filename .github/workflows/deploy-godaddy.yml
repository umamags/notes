name: Deploy to GoDaddy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: ls -la public/ || echo "public folder not found"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: ./public

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || true
          cat ~/.ssh/known_hosts

      - name: Deploy to GoDaddy
        run: |
          # Remove existing files in target directory and deploy new ones
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "rm -rf /home/fbmerf3ynq50/public_html/notes/* && mkdir -p /home/fbmerf3ynq50/public_html/notes"

          # Copy new files using SCP
          scp -r -P ${{ secrets.SSH_PORT }} ./public/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/fbmerf3ynq50/public_html/notes/

      - name: Write .htaccess file
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'HTACCESS'
          cat > /home/fbmerf3ynq50/public_html/notes/.htaccess << 'EOF'
          # Apache: pretty API URLs + single page app fallback
          RewriteEngine On
          RewriteRule ^api/(.*)$ api/index.php [QSA,L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]

          <IfModule mod_php.c>
            php_value upload_max_filesize 128M
            php_value post_max_size 130M
            php_value memory_limit 512M
          </IfModule>
          EOF
          HTACCESS

      - name: Verify deployment
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "ls -la /home/fbmerf3ynq50/public_html/notes/ | head -20"
